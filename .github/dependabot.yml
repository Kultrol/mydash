version: 2

updates:
  # Python dependencies declared in pyproject.toml.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns: ["*"]

  # Keeps the workflow action versions current; CI pins majors deliberately
  # and lets these PRs move them forward.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  # The Dockerfile pins both base images to an exact version so builds are
  # reproducible; these PRs are what move those pins forward.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker-images:
        patterns: ["*"]
