name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a PR makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test · ${{ matrix.os }} · py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One failing leg should not hide the result of the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # --python governs rather than a checked-in .python-version, so the
      # matrix leg is what actually decides the interpreter.
      - name: Install dependencies
        run: uv sync --group dev --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run pytest -q

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: uv sync --group dev

      - name: Ruff
        run: uv run ruff check src test

  lowest-direct:
    # Dependencies are declared as >=, but the lockfile only ever exercises
    # today's versions. This proves the floors we publish actually work.
    name: oldest supported dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Resolve to the lowest declared versions
        run: uv sync --group dev --python 3.12 --resolution lowest-direct

      - name: Show what was resolved
        run: uv pip list

      - name: Run tests
        run: uv run pytest -q

  build:
    # Catch a packaging break on the PR, not at release time.
    name: build artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Build wheel and sdist
        run: uv build

      - name: Install the wheel and run it from a neutral directory
        run: |
          uv tool install --force ./dist/*.whl
          cd "$(mktemp -d)"
          MYDASH_DB_PATH="$PWD/mydash.db" mydash --version
          MYDASH_DB_PATH="$PWD/mydash.db" mydash doctor --offline

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  docker:
    # The image is not published anywhere, so this job is what keeps the
    # Dockerfile honest: it has to build, and the CLI has to run inside it.
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: mydash:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run the CLI inside the image
        run: |
          docker run --rm mydash:ci --version
          docker run --rm mydash:ci doctor --offline

      # Proves the /data mount is wired up: a preference written by one
      # container has to be visible to the next. Units are stored locally,
      # so unlike `set weather city` this touches no network.
      - name: State survives the container
        run: |
          docker run --rm -v mydash-ci-data:/data mydash:ci set weather units imperial
          docker run --rm -v mydash-ci-data:/data mydash:ci config show | grep -qi imperial

  gate:
    # The one check branch protection requires. Depending on the matrix legs
    # by name would break the protection rule every time the matrix changes.
    name: all checks passed
    # always() is load-bearing: without it this job is *skipped* when a
    # dependency fails, and a skipped required check does not block a merge.
    if: always()
    needs: [test, lint, lowest-direct, build, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to have succeeded
        run: |
          echo '${{ toJSON(needs) }}' | jq -e 'all(.[]; .result == "success")' > /dev/null \
            || { echo "::error::A required CI job did not succeed."; exit 1; }
