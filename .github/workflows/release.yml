name: Release

# Fires only when a version tag is pushed, so cutting a release is a
# deliberate act: `git tag v1.0.0 && git push origin v1.0.0`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: build and publish a GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Check the tag matches the packaged version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          packaged="$(uv run python -c 'import mydash; print(mydash.__version__)')"
          if [ "$tag" != "$packaged" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $packaged"
            echo "Bump src/mydash/__init__.py, or tag the version that is there."
            exit 1
          fi

      - name: Build wheel and sdist
        run: uv build

      - name: Extract this version's changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { collecting = 1; next }
            collecting && /^## \[/ { exit }
            collecting { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG section for $version." > release-notes.md
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            ./dist/*
