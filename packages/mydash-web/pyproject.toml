[project]
name = "mydash-web"
version = "0.5.0"
description = "HTTP API for the mydash web dashboard (FastAPI)."
readme = "README.md"
authors = [{ name = "Kevin Medina", email = "physicskev@outlook.com" }]
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "mydash-core",
  "fastapi>=0.139.2",
  "python-dotenv>=1.2.2",
  "uvicorn[standard]>=0.51.0",
]

[project.urls]
Homepage = "https://github.com/Kultrol/mydash"
Repository = "https://github.com/Kultrol/mydash"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mydash"]

[tool.uv.sources]
mydash-core = { workspace = true }
