[project]
name = "mydash"
version = "0.5.0"
description = "Terminal daily dashboard: weather, news, and markets in one brief."
readme = "README.md"
authors = [{ name = "Kevin Medina", email = "physicskev@outlook.com" }]
license = { text = "MIT" }

requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28.1",
  "pydantic>=2.13.4",
  "python-dotenv>=1.2.2",
  "rich>=15.0.0",
  "typer>=0.26.4",
]

[project.scripts]
mydash = "mydash.cli.main:app"

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "pytest-mock>=3.15.1",
]

[project.urls]
Homepage = "https://github.com/Kultrol/mydash"
Repository = "https://github.com/Kultrol/mydash"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["test"]
