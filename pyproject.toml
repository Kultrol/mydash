[project]
name = "mydash-workspace"
version = "0.5.0"
description = "Development workspace for mydash CLI and web packages."
requires-python = ">=3.12"
dependencies = [
  "mydash",
  "mydash-web",
]

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "pytest-mock>=3.15.1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "packages/mydash-core",
  "packages/mydash-cli",
  "packages/mydash-web",
]

[tool.uv.sources]
mydash-core = { workspace = true }
mydash = { workspace = true }
mydash-web = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "--import-mode=importlib"
