[project]
name = "mydash"
version = "0.1.0"
description = "A command-line dashboard application that beautifully displays weather and finanical data, and news."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "typer>=0.26.4",
]
